# Free demo: SQLite data and the call counter reset when the service restarts.
services:
  - type: web
    name: mental-health-companion-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_LLM_CALLS
        value: "50"
      - key: DATABASE_PATH
        value: /tmp/mental-health-companion/app.db
      - key: CORS_ORIGINS
        value: https://mental-health-companion-dun.vercel.app
